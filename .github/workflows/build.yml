name: Release Electron App

on:
  push:
    branches: [ master, main ] # Triggered automatically on every push to master or main
  workflow_dispatch: # Allows manual execution from the GitHub UI

jobs:
  build-and-release:
    permissions:
      contents: write # Required to publish assets to the Release page
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Linux-specific dependencies for Electron Forge (fakeroot and rpmbuilder)
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      # Run the Electron Forge compilation pipeline
      - name: Run Electron Forge Make
        run: npm run make

      # Deploy to GitHub Releases (Windows - publishes only the .exe binary)
      - name: Deploy to GitHub Releases (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          name: 'Latest Electron Continuous Build'
          body: 'This release always contains the separate Electron download binaries from the latest commit.'
          overwrite: true
          files: out/make/**/*.exe

      # Deploy to GitHub Releases (macOS - publishes only the .dmg binary, leaving out the .zip)
      - name: Deploy to GitHub Releases (macOS)
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          name: 'Latest Electron Continuous Build'
          body: 'This release always contains the separate Electron download binaries from the latest commit.'
          overwrite: true
          files: out/make/**/*.dmg

      # Deploy to GitHub Releases (Linux - publishes only .deb and .rpm binaries, leaving out the .zip)
      - name: Deploy to GitHub Releases (Linux DEB & RPM)
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          name: 'Latest Electron Continuous Build'
          body: 'This release always contains the separate Electron download binaries from the latest commit.'
          overwrite: true
          files: |
            out/make/**/*.deb
            out/make/**/*.rpm
