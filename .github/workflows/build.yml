name: Release Electron App

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    permissions:
      contents: write
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Run Electron Forge Make
        run: npm run make

      # === NIEUW: DEBUG STAP OM MAPPENSTRUCTUUR TE INSPECTEREN ===
      - name: Debug - List output files (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          echo "=== SHOWING OUT/MAKE STRUCTURE ==="
          find out/make -type f || true

      - name: Debug - List output files (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "=== SHOWING OUT/MAKE STRUCTURE ==="
          Get-ChildItem -Path out/make -Recurse -File | Select-Object FullName || Write-Output "No files found"

      # Deploy to GitHub Releases (Windows)
      - name: Deploy to GitHub Releases (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          name: 'Latest Electron Continuous Build'
          body: 'This release always contains the separate Electron download binaries from the latest commit.'
          overwrite_files: true
          make_latest: true
          files: |
            out/make/**/*.exe
            out/make/*.exe

      # Deploy to GitHub Releases (macOS)
      - name: Deploy to GitHub Releases (macOS)
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          name: 'Latest Electron Continuous Build'
          body: 'This release always contains the separate Electron download binaries from the latest commit.'
          overwrite_files: true
          make_latest: true
          files: |
            out/make/**/*.dmg
            out/make/*.dmg

      # Deploy to GitHub Releases (Linux DEB & RPM)
      - name: Deploy to GitHub Releases (Linux DEB & RPM)
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          name: 'Latest Electron Continuous Build'
          body: 'This release always contains the separate Electron download binaries from the latest commit.'
          overwrite_files: true
          make_latest: true
          files: |
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/*.deb
            out/make/*.rpm
