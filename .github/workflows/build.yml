name: Build Cross-Platform Binaries

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Maakt het mogelijk om de build handmatig te starten via GitHub

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        # We gebruiken de drie verschillende OS runners van GitHub
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # 1. Haal de code op uit de repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installeer Node.js (versie 20 is stabiel voor Electron)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Systeem-specifieke dependencies installeren (Alleen nodig op Linux voor DEB/RPM)
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      # 4. Installeer alle project dependencies (inclusief devDependencies)
      - name: Install dependencies
        run: npm ci

      # 5. Voer het Electron Forge compiler-commando uit
      - name: Run Electron Forge Make
        run: npm run make

      # 6. Verzamel en upload de gegenereerde binaries naar GitHub Artifacts
      - name: Upload Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mkcert-gui-tool-windows
          path: out/make/**/*.exe

      - name: Upload Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mkcert-gui-tool-mac
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip

      - name: Upload Artifacts (Linux DEB & RPM)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mkcert-gui-tool-linux
          path: |
            out/make/**/*.deb
            out/make/**/*.rpm
