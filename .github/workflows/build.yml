name: Build Cross-Platform Binaries

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Allows manual execution from the GitHub UI

# Forces Node.js 24 environment compatibility
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Required to publish assets to the Release page
    
    strategy:
      fail-fast: false
      matrix:
        # We use the three main GitHub OS runners
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # 1. Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js workspace runtime
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # 3. Install system-specific compilation libraries (Only required on Ubuntu/Linux)
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      # 4. Install app project dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Run the Electron Forge compilation pipeline
      - name: Run Electron Forge Make
        run: npm run make

      # 6. COLLECTING: Find binaries in the entire project workspace (ignoring node_modules)
      - name: Collect Distributables (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist-artifacts
          find . -type d \( -name "node_modules" -o -name "dist-artifacts" \) -prune -o -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" \) -exec cp {} dist-artifacts/ \;
          echo "=== Collected artifacts ==="
          ls -la dist-artifacts/ || true

      - name: Collect Distributables (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir dist-artifacts
          Get-ChildItem -Path . -Recurse -Filter *.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notlike "*node_modules*" -and $_.FullName -notlike "*dist-artifacts*" } | Copy-Item -Destination dist-artifacts/
          Write-Output "=== Collected artifacts ==="
          Get-ChildItem -Path dist-artifacts/

      # 7. PUBLISHING: Attach individual clean binaries directly to the 'latest' release
      - name: Deploy Binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          name: 'Latest Electron Continuous Build'
          body: 'This release always contains the separate Electron download binaries from the latest commit.'
          overwrite_files: true
          make_latest: true
          files: dist-artifacts/*
