name: Release Electron App

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    permissions:
      contents: write
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg xvfb libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      # Bouw de app (Met virtuele display op Linux)
      - name: Run Electron Forge Make (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" npm run make

      # Bouw de app op Windows en Mac
      - name: Run Electron Forge Make (Windows / macOS)
        if: matrix.os != 'ubuntu-latest'
        run: npm run make

      # VERZAMELEN: We pakken direct de installers uit de geforceerde map en negeren de zips
      - name: Process Distributables
        run: |
          mkdir -p production-binaries
          find dist-packages/ -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" -o -name "*.exe" \) -exec cp {} production-binaries/ \; || true
          echo "=== Found the following binaries in the correct folder ==="
          ls -la production-binaries/

      # PUBLICEREN: Hang de losse binaries direct aan de 'latest' release
      - name: Deploy Separate Assets to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          name: 'Latest Electron Continuous Build'
          body: 'This release always contains the separate Electron download binaries from the latest commit.'
          overwrite_files: true
          make_latest: true
          files: production-binaries/*
